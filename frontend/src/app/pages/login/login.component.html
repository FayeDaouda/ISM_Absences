<div class="login-container">
  <div class="login-card">
    <!-- Section gauche avec logo et titre -->
    <div class="left-section">
      <!-- Logo rond orange avec icône graduation -->
      <div class="logo-circle">
        <svg width="64" height="64" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
        </svg>
      </div>
      
      <!-- Titre du système -->
      <h1 class="system-title">
        Système de Gestion des<br>Absences
      </h1>
    </div>

    <!-- formulaire -->
    <div class="right-section">
      <!-- logo ISM centré au-dessus du titre -->
      <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
        <img src="Logo_Ism.png" alt="Logo ISM" class="ism-logo-img" />
          <!-- <img src="src/assets/Logo_Ism.png" alt="Logo ISM" style="height: 60px; object-fit: contain;" /> -->
      </div>


      <!-- Titre Connexion -->
      <h2 class="connexion-title">
        Connexion
      </h2>

      <!-- Formulaire -->
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label">
            Email ou Identifiant
          </label>
          <input
            [(ngModel)]="loginData.email"
            name="email"
            id="email"
            type="email"
            required
            placeholder="admin@ism.edu.sn"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">
            Mot de passe
          </label>
          <div class="password-container">
            <input
              [(ngModel)]="loginData.password"
              name="password"
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              required
              placeholder="admin123"
              class="form-input password-input"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="password-toggle"
            >
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                <path *ngIf="showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="submit-button"
          [class.loading]="isLoading"
          [disabled]="isLoading"
        >
          <svg *ngIf="!isLoading" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/>
          </svg>
          <div *ngIf="isLoading" class="spinner"></div>
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>

        <!-- Message d'erreur -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <!-- Lien mot de passe oublié -->
        <div class="forgot-password">
          <a href="#" class="forgot-link">
            Mot de passe oublié? <span>Cliquez ici</span>
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
