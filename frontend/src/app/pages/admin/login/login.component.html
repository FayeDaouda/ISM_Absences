<div class="h-screen bg-[#FDF3E7] flex items-center justify-center font-sans">
  <div
    class="flex bg-white rounded-lg shadow-lg border-2 border-[#FBBF77] overflow-hidden w-[820px] h-[480px]">
    <div class="w-1/2 bg-white flex flex-col items-center justify-center p-6">
      <div
        class="w-32 h-32 bg-[#FFAA46] text-[#010101] rounded-full flex items-center justify-center shadow-md mb-6">
        <i class="fa-solid fa-graduation-cap text-5xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-center text-[#1F2937] leading-snug">
        Système de<br />Gestion des Absences
      </h2>
    </div>
    <div
      class="w-1/2 bg-white p-10 flex flex-col items-center justify-center relative">
      <img src="/logo.jpg" alt="Logo" class="w-16 mb-4" />
      <h1 class="text-2xl font-bold text-[#1F2937] mb-6">Connexion</h1>
      <div class="w-full text-left mb-4">
        <label class="block mb-1 text-[#78350F] font-semibold text-sm">Email ou
          identifiant</label>
        <input
          type="text"
          [(ngModel)]="username"
          class="w-full px-4 py-2 border border-[#78350F] rounded focus:outline-none focus:ring-2 focus:ring-[#F37313]" />
      </div>

      <div class="w-full text-left mb-6">
        <label class="block mb-1 text-[#78350F] font-semibold text-sm">Mot de
          passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          class="w-full px-4 py-2 border border-[#78350F] rounded focus:outline-none focus:ring-2 focus:ring-[#F37313]" />
      </div>
      <button
        (click)="login()"
        class="bg-[#F37313] text-white font-bold px-6 py-2 rounded w-full hover:bg-orange-700 transition-all duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-lock"></i>
        Se connecter
      </button>

    </div>
  </div>
</div>
