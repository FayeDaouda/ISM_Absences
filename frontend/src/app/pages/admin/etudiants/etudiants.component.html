<div class="border border-[#573826] rounded-lg shadow-md p-6 bg-white mt-5">
  <h1 class="text-2xl font-extrabold text-[#573826] tracking-wide mb-1">
    🎓 Gestion des étudiants
  </h1>
  <p class="text-sm text-gray-600 mb-5">
    Liste de tous les étudiants inscrits dans le système
  </p>

  <div class="grid grid-cols-4 gap-4 px-4 py-2 border rounded shadow text-orange-600 font-semibold text-sm rounded text-center">
    <div>Nom</div>
    <div>Prénom</div>
    <div>Matricule</div>
    <div>Classe</div>
  </div>

  @for (etu of etudiants; track etu.matricule) {
    <div class="mb-4 p-4 border rounded shadow text-center mt-5">
      <div class="grid grid-cols-4 gap-4 text-sm">
        <div>
          {{ etu.utilisateurcreate.nom }}
        </div>
        <div>
          {{ etu.utilisateurcreate.prenom }}
        </div>
        <div>
          {{ etu.matricule }}
        </div>
        <div>
          {{ etu.utilisateurcreate.role }}
        </div>
      </div>
    </div>
  }
