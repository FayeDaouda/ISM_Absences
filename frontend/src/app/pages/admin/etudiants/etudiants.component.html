<div class="border border-[#573826] rounded-lg shadow-md p-6 bg-white mt-5">
  <h1 class="text-2xl font-extrabold text-[#573826] tracking-wide mb-1">
    🎓 Gestion des étudiants
  </h1>
  <p class="text-sm text-gray-600 mb-5">
    Liste de tous les étudiants inscrits dans le système
  </p>

  <div class="grid grid-cols-4 gap-4 px-4 py-2 border rounded shadow text-orange-600 font-semibold text-sm text-center">
    <div>Nom</div>
    <div>Prénom</div>
    <div>Matricule</div>
    <div>Classe</div>
  </div>

  @for (etu of etudiantsPerPage; track etu.matricule) {
    <div class="mb-4 p-4 border rounded shadow text-center mt-5">
      <div class="grid grid-cols-4 gap-4 text-sm">
        <div>{{ etu.nom }}</div>
        <div>{{ etu.prenom }}</div>
        <div>{{ etu.matricule }}</div>
        <div>{{ etu.classeId }}</div>
      </div>
    </div>
  }

  <div class="flex justify-center items-center gap-2 mt-6 text-sm text-[#573826]">
    <button
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage === 0"
      class="px-3 py-1 border rounded disabled:opacity-50"
    >
      Précédent
    </button>

    @for (page of pages; track page) {
      <button
        (click)="goToPage(page)"
        [class.bg-[#573826]]="currentPage === page"
        [class.text-white]="currentPage === page"
        class="px-3 py-1 border rounded"
      >
        {{ page + 1 }}
      </button>
    }

    <button
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage === pages.length - 1"
      class="px-3 py-1 border rounded disabled:opacity-50"
    >
      Suivant
    </button>
  </div>
</div>
