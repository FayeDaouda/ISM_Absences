<div class="p-6 border border-[#532B00] rounded-xl mt-5 bg-[#fffaf6]">
  <h2 class="text-2xl font-extrabold text-[#532B00] mb-1">📚 Sessions du jour</h2>
  <p class="text-sm text-gray-700 mb-5">Liste de tous les cours du jour</p>

  <div class="grid md:grid-cols-3 sm:grid-cols-1 gap-6">
    @for (session of sessions(); track session.id) {
      <div class="bg-white shadow-lg rounded-lg p-4">
        <h3 class="text-lg font-bold text-orange-600 flex items-center gap-1">
          💡 {{ session.mode }}
        </h3>
        <p><span class="font-semibold text-gray-700">Salle :</span> {{ session.salleCours }}</p>
        <p><span class="font-semibold text-gray-700">Date :</span> {{ session.date }}</p>
        <p><span class="text-[#FF8800]">Heure de début :</span> <strong>{{ session.heureDebut }}</strong></p>
        <p><span class="text-[#FF8800]">Heure de fin :</span> <strong>{{ session.heureFin }}</strong></p>

        <a [routerLink]="['/admin/absences', session.id]"
           class="mt-2 inline-block font-semibold text-[#2d2d2d] hover:underline">
          Voir les absences ➜
        </a>
      </div>
    }
  </div>
</div>
